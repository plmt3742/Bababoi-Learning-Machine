# 宿主机 nginx：/etc/nginx/conf.d/bababoi.conf
# 前端 dist 在 /srv/bababoi/web；后端容器只监听 127.0.0.1:8000。
# 先 http 上线；有域名后再加 443（文件末有注释模板）。
server {
    listen 80;
    server_name _;

    root /srv/bababoi/web;
    index index.html;

    # ① 后端上传上限 10MB；nginx 默认 1m 会先 413，而且是 nginx 直接返回、不走错误信封
    client_max_body_size 12m;

    location / {
        # ② SPA 路由刷新不 404
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        # ③ 发版后别让用户看旧页面
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location /api/ {
        # ④ 结尾不加斜杠：加了会把 /api/ 剥掉，后端收到 /v1/... 全站 404
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_connect_timeout 10s;
        # ⑤ 识图两跳 90–180s；默认 60s 会在前端 180s 之前先 504
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# 有域名后：另建 443 server 块，root/location 同上，加两行证书，
# 再把上面这个 80 块改成 return 301 https://$host$request_uri;
# 证书可用 certbot --nginx -d <域名> 自动改。
