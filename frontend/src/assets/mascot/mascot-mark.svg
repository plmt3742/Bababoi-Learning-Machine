<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" role="img" aria-labelledby="mascot-mark-title">
  <title id="mascot-mark-title">小纸 · 纸面标记</title>

  <defs>
    <clipPath id="mascot-mark-sheet">
      <path d="M16 5 L41 5 L57 21 L57 50 Q57 59 48 59 L16 59 Q7 59 7 50 L7 14 Q7 5 16 5 Z"/>
    </clipPath>
    <filter id="mascot-mark-grain" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.85" numOctaves="3" seed="11" stitchTiles="stitch" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0"/>
    </filter>
  </defs>

  <!-- 纸面 -->
  <path d="M16 5 L41 5 L57 21 L57 50 Q57 59 48 59 L16 59 Q7 59 7 50 L7 14 Q7 5 16 5 Z" fill="#FFFFFF"/>

  <!-- 折角 -->
  <path d="M41 5 L57 21 L41 21 Z" fill="#165DFF"/>
  <path d="M41 5 L41 21 L57 21" fill="none" stroke="#0E42D2" stroke-width="4.5"/>

  <!-- 纸纹 -->
  <g clip-path="url(#mascot-mark-sheet)" opacity="0.06">
    <rect x="7" y="5" width="50" height="54" filter="url(#mascot-mark-grain)"/>
  </g>

  <!-- 纸面轮廓 -->
  <path d="M16 5 L41 5 L57 21 L57 50 Q57 59 48 59 L16 59 Q7 59 7 50 L7 14 Q7 5 16 5 Z" fill="none" stroke="#1B1F24" stroke-width="4.5" stroke-linejoin="round" stroke-linecap="round"/>

  <!-- 表情 -->
  <circle cx="25" cy="28" r="4.1" fill="#1B1F24"/>
  <circle cx="39" cy="28" r="4.1" fill="#1B1F24"/>
  <path d="M23 40 Q32 48 41 40" fill="none" stroke="#1B1F24" stroke-width="5" stroke-linecap="round"/>
</svg>
