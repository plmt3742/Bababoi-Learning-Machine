[project]
name = "bababoi-backend"
version = "0.1.0"
description = "巴巴博弈学习机后端（FastAPI）"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.162",
    "uvicorn[standard]>=0.54",
    "pydantic>=2.14",
    "pydantic-settings>=2.16",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",  # 生产 MySQL 驱动；后端是 sync SQLAlchemy，不能用 aiomysql（13号 §4.3）
    "alembic>=1.13",
    "bcrypt>=4",
    "pyjwt>=2",
    "openai>=2",
    "httpx>=0.28",  # app/ai/client.py 运行时 import（DeepSeekClient 的 trust_env=False 客户端）
    "pillow>=13.0.0",
    "python-multipart>=0.0.33",
]

[dependency-groups]
dev = [
    "pytest>=9.2",
    "ruff>=0.17",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# 行长由人工守（ruff 的 E501 与格式化工具冲突，不启用）
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# Depends() 写在参数默认值里是 FastAPI 官方用法，不是 bug
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

# 不写 [build-system]：这是应用不是库，uv 按虚拟项目处理，避免每次 sync 都构建自身包
