[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os

# Keep this file ASCII-only: configparser reads it with the OS locale encoding
# (GBK on Chinese Windows), so non-ASCII comments break `alembic` before it even starts.
# The DB URL is not here on purpose - alembic/env.py takes it from app settings / DATABASE_URL.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
