<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bababoi 后端测试台</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: "Microsoft YaHei", system-ui, sans-serif; margin: 0; background: #f4f5f7; color: #1d2129; font-size: 14px; }
  header { background: #165dff; color: #fff; padding: 10px 20px; display: flex; justify-content: space-between; align-items: center; }
  header b { font-size: 16px; }
  main { display: grid; grid-template-columns: 300px 1fr 1fr; gap: 12px; padding: 12px; max-width: 1400px; margin: 0 auto; }
  @media (max-width: 1100px) { main { grid-template-columns: 1fr; } }
  .card { background: #fff; border-radius: 8px; padding: 12px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
  .card h3 { margin: 0 0 10px; font-size: 14px; color: #4e5969; border-bottom: 1px solid #e5e6eb; padding-bottom: 6px; }
  label { display: block; margin: 8px 0 3px; color: #4e5969; font-size: 12px; }
  input, select, textarea { width: 100%; padding: 6px 8px; border: 1px solid #c9cdd4; border-radius: 4px; font-family: inherit; font-size: 13px; }
  textarea { min-height: 64px; resize: vertical; }
  button { padding: 6px 14px; border: none; border-radius: 4px; background: #165dff; color: #fff; cursor: pointer; font-size: 13px; margin: 8px 4px 0 0; }
  button.gray { background: #86909c; }
  button.small { padding: 3px 8px; font-size: 12px; margin: 0; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .row { display: flex; gap: 8px; }
  .row > * { flex: 1; }
  #msg { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #1d2129; color: #fff; padding: 8px 16px; border-radius: 6px; display: none; max-width: 80%; }
  .qitem { padding: 8px; border: 1px solid #e5e6eb; border-radius: 6px; margin-bottom: 6px; cursor: pointer; }
  .qitem:hover, .qitem.active { border-color: #165dff; background: #f2f7ff; }
  .qitem .excerpt { color: #4e5969; font-size: 12px; margin-top: 2px; }
  .tag { display: inline-block; background: #f2f3f5; border-radius: 3px; padding: 0 6px; font-size: 11px; margin-right: 4px; color: #4e5969; }
  .status { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11px; }
  .st-queued { background: #fff3e6; color: #ff7d00; } .st-running { background: #e8f7ff; color: #14c9c9; }
  .st-done { background: #e8ffea; color: #00b42a; } .st-failed { background: #ffece8; color: #f53f3f; }
  .ms-unmastered { background: #ffece8; color: #f53f3f; } .ms-reviewing { background: #fff3e6; color: #ff7d00; } .ms-mastered { background: #e8ffea; color: #00b42a; }
  pre { background: #f7f8fa; padding: 8px; border-radius: 4px; overflow: auto; max-height: 300px; font-size: 12px; }
  .taskline { display: flex; justify-content: space-between; padding: 4px 0; border-bottom: 1px dashed #e5e6eb; font-size: 12px; align-items: center; }
  .gq { border: 1px solid #e5e6eb; border-radius: 6px; padding: 8px; margin-bottom: 8px; }
  .gq .type { color: #165dff; font-size: 11px; }
  .opt { font-size: 12px; color: #4e5969; margin: 2px 0; }
  details summary { cursor: pointer; color: #165dff; font-size: 12px; margin-top: 4px; }
  .hidden { display: none; }
  .muted { color: #86909c; font-size: 12px; }
  .optrow, .blankrow { display: flex; gap: 6px; margin-bottom: 4px; }
</style>
</head>
<body>
<header>
  <b>Bababoi 后端测试台</b>
  <span id="whoami" class="muted">未登录</span>
</header>
<main>
  <!-- 左：登录 + 录题 -->
  <div>
    <div class="card" id="authCard">
      <h3>账号</h3>
      <label>用户名（3–32，字母/数字/下划线/中文）</label>
      <input id="username" value="tester1">
      <label>密码（至少 8 位）</label>
      <input id="password" type="password" value="test12345">
      <div>
        <button onclick="doRegister()">注册</button>
        <button class="gray" onclick="doLogin()">登录</button>
        <button class="gray" onclick="doLogout()">退出</button>
      </div>
    </div>

    <div class="card" id="createCard">
      <h3>录错题</h3>
      <div class="row">
        <div><label>学科</label><input id="subject" value="数学"></div>
        <div><label>章节（可选）</label><input id="chapter" placeholder="导数"></div>
      </div>
      <label>题型</label>
      <select id="qtype" onchange="renderTypeFields()">
        <option value="choice">选择题</option>
        <option value="blank">填空题</option>
        <option value="solve">解答题</option>
      </select>
      <label>题干 Markdown（填空题用 ___ 表示空位）</label>
      <textarea id="content_md"></textarea>
      <div id="typeFields"></div>
      <label>原题答案（可选）</label>
      <textarea id="answer_md" style="min-height:36px"></textarea>
      <label>标签（逗号分隔，最多 10 个）</label>
      <input id="tags" placeholder="导数, 极值">
      <button onclick="doCreate()">保存并自动分析</button>
      <p class="muted">保存成功后后端自动入队 analysis 任务，worker 会跑分析。</p>
    </div>
  </div>

  <!-- 中：题目列表 + 详情 -->
  <div>
    <div class="card">
      <h3>错题列表 <button class="small" onclick="loadList()">刷新</button></h3>
      <div id="qlist" class="muted">登录后显示</div>
    </div>
    <div class="card hidden" id="detailCard">
      <h3>题目详情 #<span id="d_qid"></span></h3>
      <div id="d_body"></div>
      <div>
        <button onclick="doAnalyze()">重新分析</button>
        <button onclick="doGenerate()">生成 3 道同类题</button>
        <button class="gray" onclick="loadDetail()">刷新</button>
      </div>
      <h3 style="margin-top:12px">任务</h3>
      <div id="d_tasks"></div>
      <h3 style="margin-top:12px">生成的同类题</h3>
      <div id="d_generated" class="muted">还没有，点上面按钮生成</div>
    </div>
  </div>

  <!-- 右：任务中心 + 原始数据 -->
  <div>
    <div class="card">
      <h3>任务中心（全部任务） <button class="small" onclick="loadTaskCenter()">刷新</button></h3>
      <div id="tc_list" class="muted">登录后显示</div>
    </div>
    <div class="card">
      <h3>最近一次响应原文</h3>
      <pre id="raw">-</pre>
    </div>
  </div>
</main>
<div id="msg"></div>

<script>
const API = "/api/v1";
let token = localStorage.getItem("tc_token") || "";
let me = null;
let currentQid = null;
let pollTimer = null;

// ---- 基础 ----
function toast(text, isErr) {
  const el = document.getElementById("msg");
  el.textContent = text;
  el.style.background = isErr ? "#f53f3f" : "#00b42a";
  el.style.display = "block";
  clearTimeout(el._t);
  el._t = setTimeout(() => el.style.display = "none", 4000);
}
async function api(method, path, body) {
  const opts = { method, headers: { "Content-Type": "application/json" } };
  if (token) opts.headers["Authorization"] = "Bearer " + token;
  if (body !== undefined) opts.body = JSON.stringify(body);
  const resp = await fetch(API + path, opts);
  const text = await resp.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = { raw: text }; }
  document.getElementById("raw").textContent = method + " " + path + "\n→ " + resp.status + "\n" + text;
  if (!resp.ok) {
    const m = data && data.detail ? (data.detail.message || data.detail.code) : (resp.status + " 错误");
    throw new Error(m);
  }
  return data;
}

// ---- 认证 ----
function setAuth(t, user) {
  token = t; me = user;
  localStorage.setItem("tc_token", t);
  document.getElementById("whoami").textContent = "已登录：" + user.username + " (#" + user.id + ")";
  loadList(); loadTaskCenter();
}
function doLogout() {
  token = ""; me = null; localStorage.removeItem("tc_token");
  document.getElementById("whoami").textContent = "未登录";
  document.getElementById("qlist").textContent = "登录后显示";
  document.getElementById("tc_list").textContent = "登录后显示";
  document.getElementById("detailCard").classList.add("hidden");
}
async function doRegister() {
  try {
    const data = await api("POST", "/auth/register", {
      username: val("username"), password: val("password")
    });
    setAuth(data.access_token, data.user);
    toast("注册成功并已登录");
  } catch (e) { toast(e.message, true); }
}
async function doLogin() {
  try {
    const data = await api("POST", "/auth/login", {
      username: val("username"), password: val("password")
    });
    setAuth(data.access_token, data.user);
    toast("登录成功");
  } catch (e) { toast(e.message, true); }
}

// ---- 录题 ----
const val = id => document.getElementById(id).value.trim();
const TYPE_NAME = { choice: "选择题", blank: "填空题", solve: "解答题" };
const MS_NAME = { unmastered: "未掌握", reviewing: "复习中", mastered: "已掌握" };

function renderTypeFields() {
  const t = val("qtype");
  const box = document.getElementById("typeFields");
  if (t === "choice") {
    box.innerHTML = `
      <label>选项（点击加号增行；选项文本不能为空）</label>
      <div id="optBox"></div>
      <button class="small gray" onclick="addOption()">+ 加一个选项</button>`;
    addOption(); addOption();
  } else if (t === "blank") {
    box.innerHTML = `
      <label>空位答案（第 1 空、第 2 空…；数量必须等于题干里 ___ 的个数）</label>
      <div id="blankBox"></div>
      <button class="small gray" onclick="addBlank()">+ 加一个空</button>`;
    addBlank();
  } else {
    box.innerHTML = `<p class="muted">解答题：题干整体作答，小问写在题干里即可。</p>`;
  }
}
function addOption(label, text) {
  const row = document.createElement("div");
  row.className = "optrow";
  const n = document.querySelectorAll(".optrow").length;
  row.innerHTML = `<input style="flex:0 0 56px" placeholder="A" value="${label || String.fromCharCode(65 + n)}">
    <input placeholder="选项文本" value="${text || ""}">`;
  document.getElementById("optBox").appendChild(row);
}
function addBlank(idx, text) {
  const row = document.createElement("div");
  row.className = "blankrow";
  const n = document.querySelectorAll(".blankrow").length;
  row.innerHTML = `<input style="flex:0 0 56px" placeholder="1" value="${idx || n + 1}">
    <input placeholder="第 ${n + 1} 空答案" value="${text || ""}">`;
  document.getElementById("blankBox").appendChild(row);
}
function collectBody() {
  const body = {
    subject: val("subject") || "数学",
    question_type: val("qtype"),
    content_md: val("content_md"),
    tags: val("tags") ? val("tags").split(/[,，]/).map(s => s.trim()).filter(Boolean) : [],
  };
  if (val("chapter")) body.chapter = val("chapter");
  if (val("answer_md")) body.answer_md = val("answer_md");
  if (body.question_type === "choice") {
    body.options = [...document.querySelectorAll(".optrow")].map(r => {
      const i = r.querySelectorAll("input");
      return { label: i[0].value.trim(), content_md: i[1].value.trim() };
    });
  } else if (body.question_type === "blank") {
    body.blanks = [...document.querySelectorAll(".blankrow")].map(r => {
      const i = r.querySelectorAll("input");
      return { index: parseInt(i[0].value, 10), answer_md: i[1].value.trim() };
    });
  }
  return body;
}
async function doCreate() {
  if (!token) return toast("先登录", true);
  const body = collectBody();
  if (!body.content_md) return toast("题干不能为空", true);
  try {
    const data = await api("POST", "/questions", body);
    toast("已保存，analysis 任务 #" + data.task_id + " 已入队");
    loadList(); loadTaskCenter();
  } catch (e) { toast(e.message, true); }
}

// ---- 列表 / 详情 ----
async function loadList() {
  if (!token) return;
  try {
    const page = await api("GET", "/questions?page=1&page_size=50");
    const box = document.getElementById("qlist");
    if (!page.items.length) { box.textContent = "还没有错题，左边录一道"; return; }
    box.innerHTML = page.items.map(q => `
      <div class="qitem ${q.id === currentQid ? "active" : ""}" onclick="selectQ(${q.id})">
        <div><span class="tag">${TYPE_NAME[q.question_type] || q.question_type}</span>
             <span class="tag">${q.subject}</span>
             <span class="status ms-${q.mastery_status}">${MS_NAME[q.mastery_status] || q.mastery_status}</span></div>
        <div class="excerpt">${esc(q.excerpt)}</div>
      </div>`).join("");
  } catch (e) { toast(e.message, true); }
}
function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }

function selectQ(id) { currentQid = id; loadDetail(); loadList(); }

async function loadDetail() {
  if (!currentQid || !token) return;
  try {
    const q = await api("GET", `/questions/${currentQid}?include=generated`);
    document.getElementById("detailCard").classList.remove("hidden");
    document.getElementById("d_qid").textContent = q.id;
    document.getElementById("d_body").innerHTML = `
      <div style="margin-bottom:6px">
        <span class="tag">${TYPE_NAME[q.question_type] || q.question_type}</span>
        <span class="tag">${q.subject}${q.chapter ? " · " + esc(q.chapter) : ""}</span>
        <span class="status ms-${q.mastery_status}">${MS_NAME[q.mastery_status] || q.mastery_status}</span>
      </div>
      <div style="white-space:pre-wrap">${esc(q.content_md)}</div>
      ${renderOptions(q)}
      ${q.answer_md ? `<div class="muted" style="margin-top:6px">原题答案：${esc(q.answer_md)}</div>` : ""}
      ${q.analysis ? `<details open><summary>AI 分析（topic_type: ${esc(q.analysis.topic_type || "-")}）</summary>
        <pre>${esc(JSON.stringify(q.analysis, null, 2))}</pre></details>` : `<p class="muted">还没有 AI 分析</p>`}
    `;
    document.getElementById("d_tasks").innerHTML = q.tasks.length
      ? q.tasks.map(t => `
        <div class="taskline">
          <span>#${t.id} ${t.stage === "analysis" ? "分析" : "生题"}${t.retry_index ? " 重试" + t.retry_index : ""}</span>
          <span>
            <span class="status st-${t.status}">${t.status}</span>
            ${t.status === "failed" ? `<button class="small" onclick="doRetry(${t.id})">重试</button>` : ""}
          </span>
        </div>
        ${t.error_code ? `<div class="muted">错误：${esc(t.error_code)}</div>` : ""}`).join("")
      : `<span class="muted">无任务</span>`;
    document.getElementById("d_generated").innerHTML = q.generated_questions.length
      ? q.generated_questions.map(renderGenerated).join("")
      : `<span class="muted">还没有，点上面按钮生成</span>`;
  } catch (e) { toast(e.message, true); }
}
function renderOptions(q) {
  if (!q.options || !q.options.length) return "";
  return q.options.map(o => `<div class="opt">${esc(o.label)}. ${esc(o.content_md)}</div>`).join("");
}
function renderGenerated(g) {
  let extra = "";
  if (g.options) extra = g.options.map(o => `<div class="opt">${esc(o.label)}. ${esc(o.content_md)}</div>`).join("");
  if (g.blanks) extra = g.blanks.map(b => `<div class="opt">第 ${b.index} 空：${esc(b.answer_md)}</div>`).join("");
  return `<div class="gq">
    <span class="type">${TYPE_NAME[g.question_type] || g.question_type || "-"}</span>
    <span class="tag">${esc(g.difficulty || "难度未标注")}</span>
    <span class="tag">${esc(g.validation_status)}</span>
    <div style="white-space:pre-wrap;margin-top:4px">${esc(g.content_md)}</div>
    ${extra}
    <details><summary>看答案与思路</summary>
      <div style="margin-top:4px"><b>答案：</b>${esc(g.answer_md)}</div>
      <div style="margin-top:4px"><b>思路：</b>${esc(g.explanation_md)}</div>
    </details>
  </div>`;
}

// ---- 任务 ----
async function doAnalyze() {
  try {
    const d = await api("POST", `/questions/${currentQid}/analyze`);
    toast("分析任务 #" + d.task_id + " 已入队"); startPolling(); loadDetail();
  } catch (e) { toast(e.message, true); }
}
async function doGenerate() {
  try {
    const d = await api("POST", `/questions/${currentQid}/generate`);
    toast("生题任务 #" + d.task_id + " 已入队"); startPolling(); loadDetail();
  } catch (e) { toast(e.message, true); }
}
async function doRetry(taskId) {
  try {
    await api("POST", `/tasks/${taskId}/retry`);
    toast("任务 #" + taskId + " 已重新入队"); startPolling(); loadDetail();
  } catch (e) { toast(e.message, true); }
}
function startPolling() {
  clearInterval(pollTimer);
  pollTimer = setInterval(async () => {
    await loadTaskCenter();
    if (currentQid) await loadDetail();
    const box = document.getElementById("tc_list");
    if (!box.dataset.hasActive) clearInterval(pollTimer);
  }, 1500);
}
async function loadTaskCenter() {
  if (!token) return;
  try {
    const d = await api("GET", "/tasks");
    const box = document.getElementById("tc_list");
    if (!d.items.length) { box.textContent = "还没有任务"; box.dataset.hasActive = ""; return; }
    const hasActive = d.items.some(t => t.status === "queued" || t.status === "running");
    box.dataset.hasActive = hasActive ? "1" : "";
    box.innerHTML = d.items.slice(0, 20).map(t => `
      <div class="taskline">
        <span>#${t.id} · 题目 ${t.question_id ?? "-"} · ${t.stage === "analysis" ? "分析" : "生题"}</span>
        <span><span class="status st-${t.status}">${t.status}</span>
        ${t.status === "failed" ? `<button class="small" onclick="doRetry(${t.id})">重试</button>` : ""}</span>
      </div>`).join("");
  } catch (e) { /* 轮询失败不打断 */ }
}

// ---- 预填示例 ----
document.getElementById("qtype").addEventListener("change", fillSample);
function fillSample() {
  const t = val("qtype");
  if (t === "choice") {
    document.getElementById("content_md").value = "函数 f(x)=x³-3x 的极大值点是？";
    const box = document.getElementById("optBox");
    if (box) {
      box.innerHTML = "";
      addOption("A", "-1"); addOption("B", "0"); addOption("C", "1"); addOption("D", "2");
    }
  } else if (t === "blank") {
    document.getElementById("content_md").value = "曲线 y=ln x 在点 (1,0) 处的切线方程为 ___。";
    const box = document.getElementById("blankBox");
    if (box) { box.innerHTML = ""; addBlank(1, "y = x - 1"); }
  } else {
    document.getElementById("content_md").value = "已知函数 f(x)=x²-2aln x。(1) 讨论 f(x) 的单调性；(2) 若 f(x) ≥ 0 恒成立，求 a 的取值范围。";
  }
}
window.addEventListener("DOMContentLoaded", () => {
  renderTypeFields(); fillSample();
  if (token) {
    // 用旧 token 试探，过期就静默丢弃
    api("GET", "/auth/me").then(u => setAuth(token, u)).catch(() => doLogout());
  }
});
</script>
</body>
</html>
