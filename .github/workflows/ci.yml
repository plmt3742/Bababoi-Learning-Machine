name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-network-caching: true
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Lint
        run: uv run ruff check app tests
      - name: Test
        run: uv run pytest
        env:
          LLM_MOCK: "true"
      # 契约快照防漂移：改了 schema 却没重新导出，CI 在这里红（BE-009）
      - name: OpenAPI snapshot
        run: uv run python scripts/export_openapi.py --check

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Detect frontend scaffold
        id: detect
        run: |
          if [ -f frontend/package.json ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::frontend/package.json not found; skipping frontend checks until FE-001"
          fi
      - uses: pnpm/action-setup@v4
        if: steps.detect.outputs.ready == 'true'
        with:
          version: 9
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.ready == 'true'
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Install dependencies
        if: steps.detect.outputs.ready == 'true'
        working-directory: frontend
        run: pnpm install --frozen-lockfile
      - name: Lint
        if: steps.detect.outputs.ready == 'true'
        working-directory: frontend
        run: pnpm lint
      - name: Typecheck
        if: steps.detect.outputs.ready == 'true'
        working-directory: frontend
        run: pnpm typecheck
      - name: Build
        if: steps.detect.outputs.ready == 'true'
        working-directory: frontend
        run: pnpm build
      - name: Test
        if: steps.detect.outputs.ready == 'true'
        working-directory: frontend
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            pnpm test
          else
            echo "No test script in frontend/package.json; skipping"
          fi

  # MySQL-only 迁移分支在 SQLite 测试里是 0 覆盖：这里用真库把整条链跑一遍（含降级）。
  migrations-mysql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: bababoi
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h127.0.0.1 -uroot -proot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    env:
      ALEMBIC_DATABASE_URL: mysql+pymysql://root:root@127.0.0.1:3306/bababoi?charset=utf8mb4
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-network-caching: true
      - name: Install dependencies
        run: uv sync --frozen --group dev
      - name: Upgrade head (fresh MySQL)
        run: uv run alembic upgrade head
      - name: Downgrade to base
        run: uv run alembic downgrade base
      - name: Upgrade head again
        run: uv run alembic upgrade head
      - name: Single head
        run: test "$(uv run alembic heads | grep -c '(head)')" -eq 1
